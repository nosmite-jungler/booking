<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메인 관리자 인수</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>메인 관리자 인수</h1>
  <div class="card" id="box"><span class="muted">불러오는 중…</span></div>
</div>
<script src="common.js"></script>
<script>
const KEY = qs('h');
const box = document.getElementById('box');
function render(d) {
  box.innerHTML = `<p>${esc(d.from)} → <b>${esc(d.to)}</b></p>
    <p class="muted">수락하면 메인 관리자 권한을 갖게 되고, 관리 스프레드시트 편집 권한이 추가됩니다.</p>
    <button class="ok" id="go">수락합니다</button><div class="msg"></div>`;
  document.getElementById('go').onclick = async function () {
    this.disabled = true;
    box.querySelector('.msg').textContent = '처리 중…';
    try { const m = await api('acceptHandover', { h: KEY }); box.innerHTML = `<p>${esc(m)}</p>`; }
    catch (e) { this.disabled = false; box.querySelector('.msg').textContent = '오류: ' + e.message; }
  };
}
if (!KEY) box.innerHTML = '<span class="error">메일로 받은 링크로 들어와 주세요.</span>';
else api('handover', { h: KEY }).then(render).catch(e => { box.innerHTML = `<span class="error">${esc(e.message)}</span>`; });
</script>
</body>
</html>
